<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="home-page.css">
    <link rel="icon" type="image/png" href="images/Autorium/Autorium.png">
    <title>Autorium</title>
</head>

<body>
    <header>

        <!-- Navigation -->
        <div class="top-bar">

            <!-- Logo -->
            <div class="logo">
                <img src="images/Autorium/Autorium-full-logo.png" alt="Autorium Logo">
            </div>

            <nav>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Brands</a></li>
                    <li><a href="#">Categories</a></li>
                    <li><a href="#">Compare</a></li>
                    <li><a href="#">About</a></li>
                </ul>
            </nav>
        </div>

        <!-- Search -->
        <div class="search-container">

            <input type="text" placeholder="Search any car, brand, or model...">
            <button>Search</button>
        </div>
    </header>
    <main>
        <!-- ==========================
            Browse by Brand
        =========================== -->
        <section class="car-brands">
            <h2>Browse by Brand</h2>

            <div class="brand-grid">
                <a href="#" class="brand-card">
                    <img src="images/mercedes-logo.svg" alt="Mercedes-Benz Logo">
                    <span>Mercedes-Benz</span>
                </a>

                <a href="#" class="brand-card">
                    <img src="images/bmw-logo.svg" alt="BMW Logo">
                    <span>BMW</span>
                </a>

                <a href="#" class="brand-card">
                    <img src="images/audi-logo.png" alt="Audi Logo">
                    <span>Audi</span>
                </a>

                <a href="#" class="brand-card">
                    <img src="images/porsche-logo.svg" alt="Porsche Logo">
                    <span>Porsche</span>
                </a>

                <a href="#" class="brand-card">
                    <img src="images/Toyota-logo.png" alt="Toyota Logo">
                    <span>Toyota</span>
                </a>

                <a href="#" class="brand-card">
                    <img src="images/honda-logo.png" alt="Honda Logo">
                    <span>Honda</span>
                </a>

                <a href="#" class="brand-card">
                    <img src="images/ferrari-logo.svg" alt="Ferrari Logo">
                    <span>Ferrari</span>
                </a>

                <a href="#" class="brand-card">
                    <img src="images/lamborghini-logo.svg" alt="Lamborghini Logo">
                    <span>Lamborghini</span>
                </a>

            </div>
        </section>

        <!-- ==========================
            Browse by Category
        =========================== -->

        <section class="car-categories">
            <h2>Browse by Category</h2>

            <div class="category-grid">
                <a href="#" class="category-card">
                    <img src="images/suv-logo.png" alt="SUVs">
                    <span>SUVs</span>
                </a>

                <a href="#" class="category-card">
                    <img src="images/Sedan-logo.png" alt="Sedans">
                    <span>Sedans</span>
                </a>
                
                <a href="#" class="category-card">
                    <img src="images/Coupe-logo.png" alt="Coupes">
                    <span>Coupes</span>
                </a>
                
                <a href="#" class="category-card">
                    <img src="images/Hatchback-logo.png" alt="Hatchbacks">
                    <span>Hatchbacks</span>
                </a>

                <a href="#" class="category-card">
                    <img src="images/supercars-logo.png" alt="Supercars">
                    <span>Super Cars</span>
                </a>

                <a href="#" class="category-card">
                    <img src="images/pickup-logo.png" alt="Pickups">
                    <span>Pickups</span>
                </a>

                <a href="#" class="category-card">
                    <img src="images/Electric-logo.png" alt="Electrics">
                    <span>Electrics</span>
                </a>

                <a href="#" class="category-card">
                    <img src="images/Hybrid-logo.png" alt="Hybrids">
                    <span>Hybrids</span>
                </a>
            </div>

        </section>

    </main>
</body>

</html>
